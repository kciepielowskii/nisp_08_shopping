<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Podsumowanie Zamówienia</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <a href="index.html">Lista produktów</a>
        <a href="koszyk.html">Koszyk</a>
    </nav>

    <main>
        <h1>Złóż zamówienie</h1>
        
        <form id="order-form">
            <div>
                <label for="name">Imię i nazwisko:</label>
                <input type="text" id="name" required>
            </div>
            <br>
            <div>
                <label for="address">Adres dostawy:</label>
                <input type="text" id="address" required>
            </div>
            <br>
            <button type="submit" class="btn">Potwierdź zamówienie</button>
        </form>

        <div id="success-message" style="display: none;">
            <h2>Dziękujemy za zakupy!</h2>
            <p>Twój koszyk został wyczyszczony.</p>
        </div>
    </main>

    <script src="zamowienie.js"></script>
</body>
</html>
