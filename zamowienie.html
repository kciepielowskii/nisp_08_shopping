<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Podsumowanie Zamówienia</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>📦 Twoje Zamówienie</h1>
        
        <div class="summary-card">
            <p id="itemCount">Liczba produktów: 0</p>
            <ul id="summaryList" class="order-list">
                </ul>
        </div>

        <div class="actions">
            <button id="finishBtn" class="confirm-btn">🚀 Potwierdź i zapłać</button>
            <a href="index.html" class="back-link">← Wróć do edycji listy</a>
        </div>
    </div>

    <script>
        const summaryList = document.getElementById('summaryList');
        const finishBtn = document.getElementById('finishBtn');
        const itemCount = document.getElementById('itemCount');

        const items = JSON.parse(localStorage.getItem('mojaListaZakupow')) || [];
        itemCount.textContent = `Liczba produktów: ${items.length}`;

        if (items.length === 0) {
            summaryList.innerHTML = "<li class='empty-msg'>Twoja lista jest pusta...</li>";
            finishBtn.style.display = 'none';
        } else {
            items.forEach(item => {
                const li = document.createElement('li');
                li.className = 'order-item';
                // Dodajemy ikonkę w zależności od stanu
                const statusIcon = item.completed ? "✅" : "⏳";
                li.innerHTML = `<span>${item.text}</span> <span class="status-tag">${statusIcon}</span>`;
                summaryList.appendChild(li);
            });
        }

        finishBtn.addEventListener('click', () => {
            alert("Zamówienie przyjęte do realizacji! Koszyk został wyczyszczony.");
            localStorage.removeItem('mojaListaZakupow');
            window.location.href = "index.html";
        });
    </script>
</body>
</html>
